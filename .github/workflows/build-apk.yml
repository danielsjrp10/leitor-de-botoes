name: Compilar e publicar APK

# Roda toda vez que você enviar uma "tag" (uma etiqueta de versão, tipo v0.1)
# e também pode ser disparado manualmente pela aba "Actions" no GitHub.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar o SDK do Android
        uses: android-actions/setup-android@v3

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar o APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build-output.log

      - name: Salvar log de erro no repositório (se falhou)
        if: steps.build.outcome == 'failure'
        run: |
          tail -c 60000 build-output.log > build-error.txt
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -f build-error.txt
          git commit -m "Log de erro do build (run ${{ github.run_id }})"
          git push origin HEAD:main

      - name: Parar o job com erro (se o build falhou)
        if: steps.build.outcome == 'failure'
        run: exit 1

      # Sempre disponível na aba "Actions" do repositório, mesmo sem criar tag
      - name: Publicar como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: leitor-de-botoes-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Só roda quando você envia uma tag (ex: v0.1) - cria uma página de
      # "Release" com o APK anexado, com um link direto pra baixar.
      - name: Criar release com o APK anexado
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
