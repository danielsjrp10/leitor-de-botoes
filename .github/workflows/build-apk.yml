name: Compilar e publicar APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar o SDK do Android
        uses: android-actions/setup-android@v3

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Nenhuma senha/keystore fica gravada aqui. Isto só lê "Secrets" que o
      # dono do repositório configura manualmente em:
      # Settings > Secrets and variables > Actions > New repository secret
      # Nomes esperados: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
      # RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD (veja o README).
      # Se não existirem, a build de release é gerada sem assinatura.
      - name: Preparar assinatura (se os secrets existirem)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "${{ runner.temp }}/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> "$GITHUB_ENV"
            echo "RELEASE_KEYSTORE_PASSWORD=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Keystore encontrada nos secrets - a build sera assinada."
          else
            echo "Nenhuma keystore configurada nos secrets - build de release SEM assinatura."
          fi

      - name: Compilar APK de debug (assinada automaticamente, para testes)
        run: gradle assembleDebug

      - name: Verificar assinatura da APK de debug com apksigner
        run: |
          APKSIGNER=$(find "$ANDROID_HOME" -name "apksigner" | sort -V | tail -1)
          echo "Usando apksigner em: $APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk > apk-debug-signature-check.txt 2>&1 || true
          cat apk-debug-signature-check.txt

      - name: Compilar APK de release
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleRelease 2>&1 | tee build-log.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Salvar log de erro no repositório (só se a build falhou)
        if: steps.build.outputs.exit_code != '0'
        run: |
          git config user.email "ci@local"
          git config user.name "CI Log Bot"
          mkdir -p ci-logs
          cp build-log.txt "ci-logs/build-log-${{ github.run_id }}.txt"
          git add ci-logs
          git commit -m "Log de erro do build (run ${{ github.run_id }})"
          git push origin HEAD:main
          exit 1

      - name: Publicar como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: leitor-de-botoes-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            apk-debug-signature-check.txt

      - name: Criar release com os APKs anexados
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            apk-debug-signature-check.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
